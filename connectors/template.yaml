AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Translink connectors — Ingest GTFS-RT VehiclePositions and TripUpdates
  into Databricks Delta tables via the Zerobus streaming protocol.

# ── Parameters ───────────────────────────────────────────────────────────

Parameters:
  DatabricksWorkspaceUrl:
    Type: String
    Description: Databricks workspace URL (e.g. https://dbc-xxx.cloud.databricks.com)

  DatabricksWorkspaceId:
    Type: String
    Description: Databricks workspace ID (numeric, from the ?o= parameter)

  DatabricksRegion:
    Type: String
    Description: AWS region of the Databricks workspace (e.g. ap-southeast-2)

  DatabricksClientId:
    Type: String
    NoEcho: true
    Description: Service principal application (client) ID

  DatabricksClientSecret:
    Type: String
    NoEcho: true
    Description: Service principal secret

  DatabricksVehiclePositionsTableName:
    Type: String
    Description: Fully qualified Delta table (catalog.schema.raw_vehicle_positions)

  TranslinkApiUrl:
    Type: String
    Description: Translink GTFS-RT VehiclePositions endpoint

  DatabricksTripUpdatesTableName:
    Type: String
    Description: Fully qualified Delta table (catalog.schema.raw_trip_updates)

  TranslinkTripUpdatesUrl:
    Type: String
    Description: Translink GTFS-RT TripUpdates endpoint

  DatabricksVolumePath:
    Type: String
    Description: Unity Catalog Volume path for GTFS static CSVs

  TranslinkGtfsStaticUrl:
    Type: String
    Description: Translink GTFS static feed ZIP URL

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: Python logging level

# ── Resources ────────────────────────────────────────────────────────────

Resources:
  VehiclePositionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.13
      Handler: handler.lambda_handler
      Architectures:
        - arm64
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          DATABRICKS_WORKSPACE_URL: !Ref DatabricksWorkspaceUrl
          DATABRICKS_WORKSPACE_ID: !Ref DatabricksWorkspaceId
          DATABRICKS_REGION: !Ref DatabricksRegion
          DATABRICKS_CLIENT_ID: !Ref DatabricksClientId
          DATABRICKS_CLIENT_SECRET: !Ref DatabricksClientSecret
          DATABRICKS_TABLE_NAME: !Ref DatabricksVehiclePositionsTableName
          TRANSLINK_API_URL: !Ref TranslinkApiUrl
          LOG_LEVEL: !Ref LogLevel
    Metadata:
      BuildMethod: makefile

  TripUpdatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.13
      Handler: handler.lambda_handler
      Architectures:
        - arm64
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          DATABRICKS_WORKSPACE_URL: !Ref DatabricksWorkspaceUrl
          DATABRICKS_WORKSPACE_ID: !Ref DatabricksWorkspaceId
          DATABRICKS_REGION: !Ref DatabricksRegion
          DATABRICKS_CLIENT_ID: !Ref DatabricksClientId
          DATABRICKS_CLIENT_SECRET: !Ref DatabricksClientSecret
          DATABRICKS_TRIP_UPDATES_TABLE_NAME: !Ref DatabricksTripUpdatesTableName
          TRANSLINK_TRIP_UPDATES_URL: !Ref TranslinkTripUpdatesUrl
          LOG_LEVEL: !Ref LogLevel
    Metadata:
      BuildMethod: makefile

  GtfsStaticFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.13
      Handler: handler.lambda_handler
      Architectures:
        - arm64
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          DATABRICKS_WORKSPACE_URL: !Ref DatabricksWorkspaceUrl
          DATABRICKS_CLIENT_ID: !Ref DatabricksClientId
          DATABRICKS_CLIENT_SECRET: !Ref DatabricksClientSecret
          DATABRICKS_VOLUME_PATH: !Ref DatabricksVolumePath
          TRANSLINK_GTFS_STATIC_URL: !Ref TranslinkGtfsStaticUrl
          LOG_LEVEL: !Ref LogLevel
    Metadata:
      BuildMethod: makefile

  # ── Shared EventBridge schedule ──────────────────────────────────────

  IngestionScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: transit-ingestion-schedule
      Description: Trigger VehiclePositions and TripUpdates ingestion every minute
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Arn: !GetAtt VehiclePositionsFunction.Arn
          Id: VehiclePositionsTarget
        - Arn: !GetAtt TripUpdatesFunction.Arn
          Id: TripUpdatesTarget

  ScheduleInvokeVehiclePositions:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VehiclePositionsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IngestionScheduleRule.Arn

  ScheduleInvokeTripUpdates:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TripUpdatesFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IngestionScheduleRule.Arn

  # ── GTFS Static daily schedule (disabled — trigger manually first) ───

  GtfsStaticScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: transit-gtfs-static-schedule
      Description: Trigger GTFS static feed ingestion daily at 03:00 AEST
      ScheduleExpression: cron(0 17 * * ? *)
      State: DISABLED
      Targets:
        - Arn: !GetAtt GtfsStaticFunction.Arn
          Id: GtfsStaticTarget

  ScheduleInvokeGtfsStatic:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GtfsStaticFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GtfsStaticScheduleRule.Arn

# ── Outputs ──────────────────────────────────────────────────────────────

Outputs:
  VehiclePositionsFunctionArn:
    Description: VehiclePositions Lambda function ARN
    Value: !GetAtt VehiclePositionsFunction.Arn

  VehiclePositionsFunctionName:
    Description: VehiclePositions Lambda function name
    Value: !Ref VehiclePositionsFunction

  TripUpdatesFunctionArn:
    Description: TripUpdates Lambda function ARN
    Value: !GetAtt TripUpdatesFunction.Arn

  TripUpdatesFunctionName:
    Description: TripUpdates Lambda function name
    Value: !Ref TripUpdatesFunction

  GtfsStaticFunctionArn:
    Description: GTFS Static Lambda function ARN
    Value: !GetAtt GtfsStaticFunction.Arn

  GtfsStaticFunctionName:
    Description: GTFS Static Lambda function name
    Value: !Ref GtfsStaticFunction

  ScheduleRuleName:
    Description: Shared EventBridge schedule rule name
    Value: !Ref IngestionScheduleRule

  GtfsStaticScheduleRuleName:
    Description: GTFS Static EventBridge schedule rule name
    Value: !Ref GtfsStaticScheduleRule
