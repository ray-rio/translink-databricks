resources:
  pipelines:
    translink_analytics_pipeline:
      name: translink_analytics
      catalog: ${var.catalog}
      target: ${var.schema}
      photon: true
      libraries:
        - notebook:
            path: ../src/dlt/bronze_reference.py
        - notebook:
            path: ../src/dlt/silver_enriched.py
        - notebook:
            path: ../src/dlt/gold_current.py
      clusters:
        - num_workers: 0
          node_type_id: m5d.large
          spark_conf:
            spark.databricks.cluster.profile: singleNode
            spark.master: "local[*]"
          custom_tags:
            ResourceClass: SingleNode
      configuration:
        volume_path: ${var.volume_path}
        catalog: ${var.catalog}
        schema: ${var.schema}
      continuous: false
