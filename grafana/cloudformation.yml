AWSTemplateFormatVersion: "2010-09-09"
Description: Grafana OSS on EC2 t3.micro with Docker (free tier eligible)

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access

  AllowedSSHCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed to SSH (restrict to your IP)

  AllowedGrafanaCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed to access Grafana UI (restrict to your IP)

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI (auto-resolved)

Resources:
  # ---------- Networking ----------
  GrafanaVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.200.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: grafana-vpc

  GrafanaSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref GrafanaVPC
      CidrBlock: 10.200.0.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: grafana-public-subnet

  GrafanaIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: grafana-igw

  GrafanaIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref GrafanaVPC
      InternetGatewayId: !Ref GrafanaIGW

  GrafanaRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref GrafanaVPC
      Tags:
        - Key: Name
          Value: grafana-rt

  GrafanaDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GrafanaIGWAttachment
    Properties:
      RouteTableId: !Ref GrafanaRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref GrafanaIGW

  GrafanaSubnetRTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref GrafanaSubnet
      RouteTableId: !Ref GrafanaRouteTable

  # ---------- Security Group ----------
  GrafanaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Grafana - SSH and web access
      VpcId: !Ref GrafanaVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSSHCidr
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref AllowedGrafanaCidr
          Description: Grafana web UI
      Tags:
        - Key: Name
          Value: grafana-sg

  # ---------- EC2 Instance ----------
  GrafanaInstance:
    Type: AWS::EC2::Instance
    DependsOn: GrafanaDefaultRoute
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      SubnetId: !Ref GrafanaSubnet
      SecurityGroupIds:
        - !GetAtt GrafanaSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: translink-grafana
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          exec > /var/log/grafana-setup.log 2>&1

          # --- Install Docker ---
          dnf install -y docker
          systemctl enable docker
          systemctl start docker
          usermod -aG docker ec2-user

          # Install docker compose plugin
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -sL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          # --- Set up Grafana directory ---
          mkdir -p /opt/grafana/plugins

          # --- Download Databricks plugin ---
          dnf install -y unzip
          LATEST_URL=$(curl -s https://api.github.com/repos/mullerpeter/databricks-grafana/releases/latest \
            | python3 -c "import sys,json; a=json.load(sys.stdin)['assets']; print([x['browser_download_url'] for x in a if x['name'].endswith('.zip')][0])")
          curl -sL "$LATEST_URL" -o /tmp/databricks-plugin.zip
          unzip -qo /tmp/databricks-plugin.zip -d /opt/grafana/plugins
          rm /tmp/databricks-plugin.zip

          # --- Write docker-compose.yml ---
          cat > /opt/grafana/docker-compose.yml << 'COMPOSE'
          services:
            grafana:
              image: grafana/grafana-oss:latest
              container_name: translink-grafana
              ports:
                - "3000:3000"
              environment:
                GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: mullerpeter-databricks-datasource
              volumes:
                - grafana-data:/var/lib/grafana
                - ./plugins:/var/lib/grafana/plugins
              restart: unless-stopped

          volumes:
            grafana-data:
          COMPOSE

          # --- Start Grafana ---
          cd /opt/grafana
          docker compose up -d

  GrafanaEIP:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref GrafanaInstance
      Tags:
        - Key: Name
          Value: translink-grafana-eip

Outputs:
  GrafanaURL:
    Description: Grafana web UI (default login admin/admin)
    Value: !Sub "http://${GrafanaEIP}:3000"

  PublicIP:
    Description: EC2 public IP
    Value: !Ref GrafanaEIP

  SSHCommand:
    Description: SSH into the instance
    Value: !Sub "ssh -i ~/.ssh/translink-grafana.pem ec2-user@${GrafanaEIP}"
